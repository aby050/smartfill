<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Smartfill</title>
<style>
:root { --fg:#16181d; --bg:#fff; --muted:#6b7280; --line:rgba(0,0,0,.12); --accent:#5b54d6; }
@media (prefers-color-scheme: dark){ :root{ --fg:#e8e9ec; --bg:#1b1d22; --muted:#9aa0ab; --line:rgba(255,255,255,.14); --accent:#8b84ff; } }
body { width:280px; margin:0; padding:14px; background:var(--bg); color:var(--fg);
  font:13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
h1 { font-size:14px; margin:0 0 10px; display:flex; align-items:center; gap:6px; }
.state { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px;
  padding:14px 0; }
.spin { width:12px; height:12px; border:2px solid rgba(128,128,128,.3);
  border-top-color:var(--accent); border-radius:50%; animation:sp .7s linear infinite; flex:none; }
@keyframes sp { to { transform:rotate(360deg); } }
.big { font-size:22px; font-weight:600; line-height:1; }
.sum { display:flex; align-items:baseline; gap:8px; margin-bottom:10px; }
.sum span { font-size:12px; color:var(--muted); }
ul.br { list-style:none; margin:0 0 12px; padding:0; font-size:12px; color:var(--muted); }
ul.br li { display:flex; justify-content:space-between; padding:3px 0;
  border-bottom:1px solid var(--line); }
ul.br li b { font-weight:500; color:var(--fg); }
button { width:100%; padding:9px; margin-bottom:6px; font:inherit; font-weight:500;
  border-radius:8px; cursor:pointer; border:1px solid var(--line); background:transparent; color:inherit; }
button.pri { background:var(--accent); border-color:var(--accent); color:#fff; font-size:14px; padding:11px; }
button:disabled { opacity:.5; cursor:default; }
button:not(:disabled):hover { filter:brightness(1.08); }
.kbd { color:var(--muted); font-size:11px; text-align:center; margin:8px 0 0; }
.warn { color:#c0392b; font-size:12px; margin:0 0 10px; }
.note { color:var(--muted); font-size:11px; margin:0 0 10px; }
</style></head>
<body>
  <h1>Smartfill</h1>
  <div id="view">
    <div class="state"><span class="spin"></span><span id="stateText">Reading the form…</span></div>
  </div>
<script src="popup.js"></script>
</body></html>
