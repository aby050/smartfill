name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate manifest
        run: node -e "const m=require('./manifest.json'); if(m.manifest_version!==3) process.exit(1); console.log(m.name, m.version)"
      - name: Check referenced files exist
        run: |
          node -e "
          const fs=require('fs'), m=require('./manifest.json');
          const files=[m.background.service_worker, m.action.default_popup, m.options_page,
            ...m.content_scripts.flatMap(c=>[...(c.js||[]),...(c.css||[])]),
            ...Object.values(m.icons)];
          const missing=files.filter(f=>!fs.existsSync(f));
          if(missing.length){console.error('Missing:',missing);process.exit(1)}
          console.log(files.length,'files OK')"
      - name: Unit tests
        run: node test/run.js
